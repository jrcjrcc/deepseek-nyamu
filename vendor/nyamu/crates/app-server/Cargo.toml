[package]
name = "nyamu-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DeepWhale HTTP/SSE app-server transport"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.5", features = ["json"] }
clap.workspace = true
dirs = "6.0.0"
nyamu-agent = { path = "../agent", version = "0.8.53" }
nyamu-config = { path = "../config", version = "0.8.53" }
nyamu-core = { path = "../core", version = "0.8.53" }
nyamu-execpolicy = { path = "../execpolicy", version = "0.8.53" }
nyamu-hooks = { path = "../hooks", version = "0.8.53" }
nyamu-mcp = { path = "../mcp", version = "0.8.53" }
nyamu-protocol = { path = "../protocol", version = "0.8.53" }
nyamu-state = { path = "../state", version = "0.8.53" }
nyamu-tools = { path = "../tools", version = "0.8.53" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3.16"
tower = "0.5"
