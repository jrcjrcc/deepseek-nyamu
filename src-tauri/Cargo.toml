# DeepWhale Tauri 桌面应用
#
# 这是 Tauri v2 桌面应用的 crate，依赖所有 nyamu 引擎 crates。
# 通过 vendor/nyamu/crates/ 下的路径依赖引入 12 个 nyamu crate。
# 同时依赖 Tauri v2 核心库和 shell 插件。

[package]
name = "nyamuwhale"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeepWhale — nyamu engine with nyamu-style desktop UI"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# ── 通用 Rust 依赖 ──────────────────────────────────────────────
anyhow.workspace = true
serde.workspace = true
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
async-trait.workspace = true
futures = "0.3"
futures-util = "0.3"
sha2.workspace = true
# ── 新工具依赖 ──────────────────────────────────────────────────
notify-rust = "4"
html2md = "0.2"
ignore = "0.4"
toml.workspace = true

# ── Tauri 依赖 ──────────────────────────────────────────────────
tauri.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

# ── nyamu 引擎 crate（路径依赖） ────────────────────────────────
nyamu-core = { path = "../vendor/nyamu/crates/core" }
nyamu-config = { path = "../vendor/nyamu/crates/config" }
nyamu-tools = { path = "../vendor/nyamu/crates/tools" }
nyamu-state = { path = "../vendor/nyamu/crates/state" }
nyamu-mcp = { path = "../vendor/nyamu/crates/mcp" }
nyamu-execpolicy = { path = "../vendor/nyamu/crates/execpolicy" }
nyamu-secrets = { path = "../vendor/nyamu/crates/secrets" }
nyamu-provider = { path = "../vendor/nyamu/crates/provider" }
nyamu-protocol = { path = "../vendor/nyamu/crates/protocol" }
nyamu-agent = { path = "../vendor/nyamu/crates/agent" }
nyamu-hooks = { path = "../vendor/nyamu/crates/hooks" }
nyamu-app-server = { path = "../vendor/nyamu/crates/app-server" }
nyamu-release = { path = "../vendor/nyamu/crates/release" }

[dev-dependencies]
tempfile.workspace = true
