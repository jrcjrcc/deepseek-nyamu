<!doctype html>
<!--
  DeepWhale 应用 HTML 入口
  - 语言设置为 zh-CN（中文界面）
  - 根容器 <div id="root"> 供 React 挂载
  - 通过 Vite 的模块脚本加载 /src/main.tsx
  - 图标使用 /logo.svg（SVG 矢量图标）
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepWhale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
